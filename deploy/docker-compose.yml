# Local development only — Kafka (single-node, KRaft mode, no Zookeeper needed)
# and MongoDB. Run with: docker compose up -d
# Kafka broker: localhost:9092
# MongoDB: mongodb://localhost:27017/transit_pulse
version: "3.8"

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: transit-pulse-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data

  mongo:
    image: mongo:7
    container_name: transit-pulse-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: transit_pulse
    volumes:
      - mongo-data:/data/db

volumes:
  kafka-data:
  mongo-data: